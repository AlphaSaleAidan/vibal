<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VIBAL — Editor</title>
<style>
  :root{
    --bg:#161618; --chrome:#1f1f22; --chrome2:#2a2a2e; --panel:#1c1c1f; --line:#34343a;
    --ink:#ecedf1; --muted:#8a8a94; --dim:#63636c;
    --active:#5e6ad2; --active2:#4954c4; --sel:#f5c518;
    --video:#3f6fb0; --title:#7d5bbe; --audio:#3aa869; --gen:#b07de0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;user-select:none;
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-rows:38px minmax(0,45%) 36px minmax(0,1fr);height:100vh}

  .topbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(180deg,#232327,#1d1d20);border-bottom:1px solid var(--line)}
  .topbar .logo{font-weight:700;letter-spacing:.16em;font-size:14px}
  .topbar .proj{color:var(--muted);font-size:12px}
  .topbar .spacer{flex:1}
  .topbar .badge{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .iconbtn{background:var(--chrome2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;transition:background .12s,border-color .12s}
  .iconbtn:hover{background:#34343b}
  .iconbtn:active{transform:translateY(1px)}
  .iconbtn:disabled{opacity:.32;cursor:default}
  .iconbtn.tool.on{background:var(--active);border-color:var(--active2);color:#fff}
  .iconbtn.agent{color:var(--sel);border-color:#4a3a1e}
  .iconbtn.danger:hover{background:#4a2226;border-color:#6a2f34}

  .top{display:grid;grid-template-columns:262px minmax(0,1fr) 302px;min-height:0;border-bottom:1px solid var(--line)}
  .pane{min-height:0;overflow:auto;background:var(--panel)}
  .pane+.pane{border-left:1px solid var(--line)}
  .pane .head{position:sticky;top:0;background:var(--chrome);border-bottom:1px solid var(--line);padding:7px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);z-index:2}

  .media{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #262629;cursor:pointer;transition:background .1s}
  .media:hover{background:#26262b}
  .thumb{width:64px;height:36px;border-radius:4px;flex:0 0 64px;position:relative;overflow:hidden;background-size:cover}
  .thumb .k{position:absolute;left:4px;bottom:2px;font-size:9px;color:#e8f5ff;opacity:.85;text-shadow:0 1px 2px #000}
  .media .mname{font-size:12px;font-weight:500}
  .media .mmeta{font-size:11px;color:var(--muted)}
  .hint{padding:8px 12px;color:var(--dim);font-size:11px}

  .viewer{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 50% 0%,#151518,#0c0c0e);position:relative}
  .stage{aspect-ratio:16/9;max-height:76%;max-width:88%;background:#000;border-radius:5px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 50px rgba(0,0,0,.6),inset 0 0 0 1px #26262b}
  .stage .card{text-align:center;padding:0 20px}
  .stage .swatch{width:56px;height:56px;border-radius:12px;margin:0 auto 12px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .stage .big{font-size:24px;font-weight:600}
  .stage .sub{color:var(--muted);font-size:11px;margin-top:6px}
  .transport{display:flex;align-items:center;gap:12px;margin-top:12px}
  .transport .tc{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;color:#e4e8ef;letter-spacing:.04em}
  .tbtn{width:32px;height:27px;border-radius:6px;background:var(--chrome2);border:1px solid var(--line);color:var(--ink);cursor:pointer}
  .tbtn:hover{background:#34343b}

  .insp-tabs{display:flex;gap:4px;padding:8px 10px 0}
  .insp-tabs button{background:transparent;border:1px solid transparent;border-radius:6px 6px 0 0;color:var(--muted);padding:6px 12px;font-size:12px;cursor:pointer}
  .insp-tabs button.on{color:var(--ink);background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
  .insp-body{padding:12px 14px}
  .prop{display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center;margin:9px 0}
  .prop label{color:var(--muted);font-size:11px}
  .prop input[type=range]{width:100%;accent-color:var(--active)}
  .prop input[type=text]{grid-column:2/4;background:#111114;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:5px 7px;font-size:12px}
  .prop .val{font:11px ui-monospace,Menlo,monospace;text-align:right}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #262629;font-size:12px}
  .kv span:first-child{color:var(--muted)}
  .kv code{font:11px ui-monospace,Menlo,monospace}
  .empty{color:var(--dim);font-size:12px;padding:16px 4px;text-align:center}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:#3a2f14;color:var(--sel)}

  .tltoolbar{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line)}
  .tltoolbar .grp{display:flex;gap:6px;align-items:center}
  .tltoolbar .sep{width:1px;height:20px;background:var(--line)}
  .tltoolbar .spacer{flex:1}
  .tltoolbar .hud{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .tltoolbar .zoom{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
  .tltoolbar input[type=range]{accent-color:var(--active)}

  .tl{display:grid;grid-template-columns:186px minmax(0,1fr);min-height:0;background:#131315}
  .tlindex{overflow:auto;background:var(--panel);border-right:1px solid var(--line)}
  .tlindex .ihead{padding:7px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  .irow{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid #202023}
  .irow:hover{background:#26262b}
  .irow.on{background:#2c2c33}
  .idot{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
  .tlscroll{overflow:auto;position:relative}
  .tlscroll.blade{cursor:crosshair}
  .tlcontent{position:relative}
  .ruler{position:sticky;top:0;height:22px;background:#1b1b1e;border-bottom:1px solid var(--line);z-index:7;cursor:text}
  .ruler .tick{position:absolute;top:0;height:22px;border-left:1px solid #313138;padding-left:4px;font:10px ui-monospace,Menlo,monospace;color:var(--dim)}
  .tlbody{position:relative}
  .tlscroll.blade .clip{cursor:crosshair}

  .clip{position:absolute;border-radius:5px;overflow:hidden;cursor:grab;border:1px solid rgba(0,0,0,.45);box-shadow:0 1px 2px rgba(0,0,0,.45);transition:box-shadow .1s}
  .clip:active{cursor:grabbing}
  .clip .lab{position:absolute;left:7px;bottom:3px;right:7px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .clip.sel{outline:2px solid var(--sel);outline-offset:-2px;box-shadow:0 0 0 1px rgba(245,197,24,.35),0 3px 10px rgba(0,0,0,.55);z-index:6}
  .clip .ai{position:absolute;top:3px;right:4px;font-size:8px;background:rgba(0,0,0,.5);color:#fff;padding:0 4px;border-radius:3px}
  .clip .top{position:absolute;top:0;left:0;right:0;height:3px}
  .clip.video .top{background:#8ab6ff}.clip.title .top{background:#caa8ff}.clip.audio .top{background:#7ce7ac}
  .clip .film{position:absolute;inset:3px 0 0;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,transparent 1px 24px)}
  .clip .handle{position:absolute;top:0;bottom:0;width:9px;z-index:4;opacity:0;cursor:ew-resize;transition:opacity .1s}
  .clip:hover .handle,.clip.sel .handle{opacity:1}
  .clip .handle.l{left:0;background:linear-gradient(90deg,rgba(255,255,255,.55),transparent)}
  .clip .handle.r{right:0;background:linear-gradient(270deg,rgba(255,255,255,.55),transparent)}
  .connector{position:absolute;width:1px;background:#71717e;z-index:1}
  .spineband{position:absolute;left:0;right:0;background:rgba(255,255,255,.035);border-top:1px solid #2a2a2f;border-bottom:1px solid #2a2a2f}
  .playhead{position:absolute;top:0;width:1px;background:#e5484d;z-index:8;pointer-events:none}
  .playhead .ph{position:absolute;top:0;left:-5px;width:11px;height:9px;background:#e5484d;border-radius:0 0 3px 3px}
  .snapguide{position:absolute;top:0;width:1px;background:#ff5ad0;z-index:9;pointer-events:none;display:none}
  .marker{position:absolute;top:0;z-index:9;cursor:pointer}
  .marker .flag{position:absolute;top:2px;left:0;width:9px;height:12px;background:var(--sel);border-radius:1px 2px 2px 0;box-shadow:0 1px 2px rgba(0,0,0,.5)}
  .marker .stem{position:absolute;top:2px;left:0;width:1px;background:rgba(245,197,24,.5)}
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <span class="logo">VIBAL</span>
      <span class="proj" id="projName">—</span>
      <span class="badge">editor preview · real ops on the Phase 0 engine</span>
      <span class="spacer"></span>
      <button class="iconbtn" data-action="undo" id="undoBtn">↩ Undo</button>
      <button class="iconbtn" data-action="redo" id="redoBtn">↪ Redo</button>
    </div>

    <div class="top">
      <div class="pane">
        <div class="head">Browser · Media</div>
        <div id="browserList"></div>
        <div class="hint">Click a clip to append it to the storyline.</div>
      </div>
      <div class="pane viewer">
        <div class="stage" id="stage"></div>
        <div class="transport">
          <button class="tbtn" data-action="toStart">⏮</button>
          <button class="tbtn" data-action="playpause" id="playBtn">▶</button>
          <button class="tbtn" data-action="toEnd">⏭</button>
          <span class="tc" id="tc">00:00:00:00</span>
        </div>
      </div>
      <div class="pane">
        <div class="head">Inspector</div>
        <div class="insp-tabs" id="inspTabs">
          <button data-tab="info" class="on">Info</button>
          <button data-tab="video">Video</button>
          <button data-tab="audio">Audio</button>
        </div>
        <div class="insp-body" id="inspBody"></div>
      </div>
    </div>

    <div class="tltoolbar">
      <div class="grp">
        <button class="iconbtn tool on" data-tool="select">▮ Select</button>
        <button class="iconbtn tool" data-tool="blade">⊟ Blade</button>
        <button class="iconbtn tool" data-tool="mask">◈ Mask</button>
      </div>
      <div class="sep"></div>
      <div class="grp">
        <button class="iconbtn" data-action="addTitle">＋ Title</button>
        <button class="iconbtn" data-action="marker">⚑ Marker</button>
        <button class="iconbtn danger" data-action="delete">⌫ Delete</button>
        <button class="iconbtn" data-action="ripple">⇥ Ripple-del</button>
      </div>
      <div class="sep"></div>
      <div class="grp">
        <button class="iconbtn agent" data-action="agent">✦ Agent: tighten</button>
        <button class="iconbtn" data-action="revert" id="revertBtn">Revert</button>
      </div>
      <div class="spacer"></div>
      <div class="hud" id="hud"></div>
      <div class="zoom">Zoom <input type="range" id="zoom" min="1" max="12" step="0.5" value="3" /></div>
    </div>

    <div class="tl">
      <div class="tlindex">
        <div class="ihead">Timeline Index</div>
        <div id="indexList"></div>
      </div>
      <div class="tlscroll" id="tlscroll">
        <div class="tlcontent" id="tlcontent">
          <div class="ruler" id="ruler"></div>
          <div class="tlbody" id="tlbody"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
